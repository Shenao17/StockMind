# StockMind — Orquestación base
# Los valores sensibles viven en .env (no versionado). Ver .env.example.
# Solo el gateway y el frontend se publican al host; MySQL, backend y analytics
# son accesibles únicamente dentro de la red de Docker.
# (En desarrollo, docker-compose.override.yml publica MySQL en 127.0.0.1.)

services:

  mysql:
    image: mysql:8.0
    container_name: stockmind_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: stockmind_db
      MYSQL_USER: ${MYSQL_USER:?Falta MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build: ./backend
    container_name: stockmind_backend
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stockmind_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_PUBLIC_URL: ${FRONTEND_URL:-http://localhost:5173}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-}
      STOCKMIND_MFA_KEY: ${STOCKMIND_MFA_KEY:-}
      # Correo transaccional: 'resend' = real; vacío = sin proveedor (en dev solo se escribe el enlace en el log)
      STOCKMIND_EMAIL_PROVIDER: ${STOCKMIND_EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      # Pasarela de pagos: vacío = pagos desactivados; 'simulated' solo en desarrollo (ver override)
      STOCKMIND_PAYMENTS_PROVIDER: ${STOCKMIND_PAYMENTS_PROVIDER:-}
    depends_on:
      mysql:
        condition: service_healthy

  analytics:
    build: ./analytics
    container_name: stockmind_analytics
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: stockmind_db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Falta INTERNAL_API_KEY en .env}
    depends_on:
      mysql:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: stockmind_gateway
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JAVA_API_URL: http://backend:8080
      PYTHON_API_URL: http://analytics:8000
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Falta INTERNAL_API_KEY en .env}
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LANDING_URL: ${LANDING_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    depends_on:
      backend:
        condition: service_started
      analytics:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: stockmind_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:3000}
    depends_on:
      - gateway

volumes:
  mysql_data:
