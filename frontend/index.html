<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>StockMind</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="StockMind: inventario, ventas y predicción de demanda para tu negocio." />
    <meta name="theme-color" content="#090D19" />

    <!-- Íconos: SVG para navegadores modernos, .ico de respaldo, y los de pantalla de inicio -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Vista previa al compartir el enlace. Para que WhatsApp/LinkedIn la muestren,
         og:image debe ser una dirección absoluta: se ajusta al publicar con el dominio real. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StockMind" />
    <meta property="og:description" content="Inventory Intelligence Platform" />
    <meta property="og:image" content="/brand/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
