# Configuración SOLO para pruebas automáticas: H2 en memoria, sin tocar MySQL.
spring.datasource.url=jdbc:h2:mem:stockmind_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secreto de pruebas (no es un secreto real)
jwt.secret=secreto-solo-para-pruebas-automaticas-0123456789abcdef
jwt.expiration=3600000
