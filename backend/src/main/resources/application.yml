# StockMind — Configuración base (sin secretos)
# Datos de conexión y secretos llegan por variables de entorno (docker-compose / .env)
# o por un application.properties local (ignorado por git; ver application.properties.example).
spring:
  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo VALIDA que las entidades coincidan.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Bases ya existentes (creadas antes de Flyway con schema.sql): se toma el esquema
    # actual como versión 1 en lugar de intentar recrearlo.
    baseline-on-migrate: true
    baseline-version: "1"
    # Nunca permitir borrar la base desde Flyway
    clean-disabled: true

# ── Registro de empresas ──
stockmind:
  trial-days: 14            # prueba gratis al verificar el correo (autoregistro)
  verification-hours: 24    # vigencia del enlace de verificación
  terms-version: "2026-11"  # versión de los términos que se registra al aceptar
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
    name: ${PLATFORM_ADMIN_NAME:}      # nombre del dueño (opcional)
  platform:
    session-minutes: 120      # sesión del equipo de plataforma (las empresas usan jwt.expiration)
  mfa:
    key: ${STOCKMIND_MFA_KEY:}  # llave que cifra los secretos TOTP; vacío = derivada de JWT_SECRET (solo desarrollo)
  billing:
    default-plan: PRO         # plan con el que prueba quien no elige uno
    iva-rate: 0.19            # IVA que se suma al precio de los planes
    grace-days: 7             # tras vencer: solo lectura durante estos días
    retention-days: 90        # suspendida: los datos se conservan este tiempo antes de cancelar
    payment-link-hours: 48    # vigencia de un enlace de pago
    cache-seconds: 30         # caché del estado de la suscripción (ver EntitlementService)
    cron: "0 0 6 * * *"       # ciclo diario: avisos y cambios de estado
    scheduler-enabled: true
  mail:
    # resend = correo real con Resend; vacío = sin proveedor (en dev solo se escribe el enlace en el log)
    provider: ${STOCKMIND_EMAIL_PROVIDER:}
    from: ${EMAIL_FROM:}              # "StockMind <no-responder@tu-dominio.com>" (dominio verificado en Resend)
    reply-to: ${EMAIL_REPLY_TO:}      # opcional
    logo-url: ${EMAIL_LOGO_URL:}      # opcional: URL pública (https) del PNG del logo para el encabezado de los correos
    timeout-seconds: 10
    resend:
      api-key: ${RESEND_API_KEY:}
  payments:
    # simulated = pasarela de pruebas (solo desarrollo/demos). Sin valor, los cobros responden 503.
    provider: ${STOCKMIND_PAYMENTS_PROVIDER:}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}   # base de los enlaces que van en los correos
